{% extends "base.html" %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-sm border-0 rounded-4">
                <div class="card-header bg-white py-3 text-center border-bottom-0">
                    <h4 class="mb-0 fw-bold">Вхід в кабінет</h4>
                </div>
                <div class="card-body p-4 pt-0">
                    <form method="post">
                        {% csrf_token %}

                        {% if form.errors %}
                            <div class="alert alert-danger small py-2 text-center">
                                Невірний логін або пароль. Будь ласка, спробуйте ще раз.
                            </div>
                        {% endif %}

                        <div class="mb-3">
                            <label for="id_username" class="form-label fw-bold small">Логін (Ім'я користувача)</label>
                            <input type="text" name="username" class="form-control py-2 shadow-none" id="id_username" required autofocus>
                        </div>

                        <div class="mb-4">
                            <div class="d-flex justify-content-between">
                                <label for="id_password" class="form-label fw-bold small">Пароль</label>

                            </div>
                            <input type="password" name="password" class="form-control py-2 shadow-none" id="id_password" required>
                        </div>

                        <div class="d-grid mt-4">
                            <button type="submit" class="btn btn-primary btn-lg fw-bold">Увійти</button>
                        </div>

                        <hr class="my-4">

                        <div class="text-center">
                            <p class="small text-muted mb-2">Ще немає акаунта?</p>
                            <a href="{% url 'register' %}" class="btn btn-outline-success w-100 fw-bold">Зареєструватись</a>
                        </div>

                        <input type="hidden" name="next" value="{{ next }}">
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
