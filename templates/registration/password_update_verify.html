{% extends "base.html" %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-sm border-0 rounded-4">
                <div class="card-body p-4 text-center">
                    <h4 class="fw-bold mb-3">Підтвердження кодом</h4>
                    <p class="text-muted small">Код надіслано на вашу пошту. Введіть 6 цифр нижче.</p>
                    
                    <form method="post" class="mb-3">
                        {% csrf_token %}
                        <input type="text" name="code" class="form-control text-center mb-3 fw-bold fs-4" placeholder="000000" maxlength="6" required>
                        <button type="submit" class="btn btn-success w-100 py-2 fw-bold">Підтвердити</button>
                    </form>
                    
                    <form method="post">
                        {% csrf_token %}
                        <button type="submit" name="resend" class="btn btn-link text-decoration-none text-muted">
                            Не отримали код? <span class="text-primary fw-medium">Надіслати повторно</span>
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
